[FIRMWARE_NO_OS]
file = ../cmake_emw_spi_no_os/build/emw_spi_no_os.bin
address = 0x08000000
map_file = ../cmake_emw_spi_no_os/build/emw_spi_no_os.map

[FIRMWARE_FREE_RTOS]
file = ../cmake_emw_spi_freertos/build/emw_spi_freertos.bin
address = 0x08000000
map_file = ../cmake_emw_spi_no_os/build/emw_spi_freertos.map

[FIRMWARE_FREE_RTOS_LWIP]
file = ../cmake_emw_spi_lwip_freertos/build/emw_spi_lwip_freertos.bin
address = 0x08000000
map_file = ../cmake_emw_spi_no_os/build/emw_spi_lwip_freertos.map

